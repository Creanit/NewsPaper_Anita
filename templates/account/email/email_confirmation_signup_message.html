<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Подтверждение регистрации</title>
</head>
<body>
    {% load account %}

    <h2>Здравствуй, {{ user.username }}!</h2>

    <p>Спасибо за регистрацию на News Portal.</p>

    <p>
        Чтобы активировать аккаунт, перейди по ссылке:
        <a href="{{ activate_url }}">подтвердить регистрацию</a>
    </p>

    <p>После подтверждения ты сможешь пользоваться сайтом.</p>
</body>
</html>
