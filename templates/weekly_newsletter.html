<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Новости за неделю</title>
</head>
<body>
    <h2>Здравствуй, {{ user.username }}!</h2>

    <p>Новые статьи за неделю в категории: {{ category.category_name }}</p>

    <ul>
        {% for post in posts %}
            <li>
                <a href="http://127.0.0.1:8000{{ post.get_absolute_url }}">
                    {{ post.title }}
                </a>
                <br>
                {{ post.content|truncatechars:50 }}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
