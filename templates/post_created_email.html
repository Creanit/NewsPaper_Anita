<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Новая статья</title>
</head>
<body>
    <h2>{{ post.title }}</h2>

    <p>Здравствуй, {{ username }}. Новая статья в твоём любимом разделе!</p>

    <p>{{ post.content|truncatechars:50 }}</p>

    <a href="http://127.0.0.1:8000{{ post.get_absolute_url }}">
        Читать полностью →
    </a>
</body>
</html>
